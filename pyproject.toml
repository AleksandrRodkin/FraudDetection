[tool.poetry]
name = "frauddetection"
version = "0.1.0"
description = "Fraud detection for bank account application"
authors = ["Aleksandr Rodkin <alekserod@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pandas = "2.2.2"
numpy = "1.26.4"
matplotlib = "3.9.2"
seaborn = "0.13.2"
scikit-learn = "1.6.1"
optuna = "4.4.0"
xgboost = "3.0.1"
imbalanced-learn = "0.13.0"
shap = "0.48.0"
fastapi = "0.115.12"
sqlalchemy = "2.0.42"
uvicorn = "0.34.2"
dotenv = "0.9.9"
pydantic = "2.11.7"
loguru = "0.7.3"
asyncio = "3.4.3"
asyncpg = "0.30.0"
joblib = "1.4.2"
tqdm = "4.67.1"
scipy = "1.16.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
